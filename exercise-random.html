<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        const answer = randomInt(1, 100);
        let guess;
        let numGuesses = 0;
        let min = 1;
        let max = 100;
        while (guess !== answer) {
            guess = parseInt(prompt(`猜數字 ${min}~${max}:`));
            numGuesses++;

            if (isNaN(guess)) {
                alert("請輸入有效的數字！");
                continue;
            }

            if (guess === answer) {
                alert(`恭喜！你花了 ${numGuesses} 次猜中答案是 ${answer}！`);
                // 這裡不需要 break，因為迴圈條件 (guess !== answer) 會在下一輪自動失效
            } else if (guess < answer) {
                alert(`比 ${guess} 大`);
                min = Math.max(min, guess); // 更新下限
            } else {
                alert(`比 ${guess} 小`);
                max = Math.min(max, guess); // 更新上限
            }
        }

    </script>
</body>

</html>
