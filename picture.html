<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 500px;
            background-color: white;
            border: 1px solid black;
            border-radius: 0px 0px 12px 12px;
            overflow: hidden;
        }

        .card-img {

            position: relative;
            /* 保持寬高比 */
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 0px;
            right: 0px;
            background-color: red;
            color: white;
            font-size: 18px;
            padding: 12px;
            border-radius: 12px;
        }

        .card-title {
            font-size: 24px;
            font-weight: bold;
        }

        .card-content {
            font-size: 16px;
            color: black;
            padding: 0px 0px 80px 0px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-img"><img src="https://picsum.photos/500/300/?random=10" />
            <div class="badge">hot</div>
        </div>
        <div class="card-body">
            <div class="card-title">卡片標題</div>
            <div class="card-content">這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容 </div>
        </div>
    </div>
</body>

</html>
